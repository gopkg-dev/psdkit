<!doctype html>
<html lang="zh-CN" data-theme="dark" data-base="{{ '/' | relative_url }}" data-build="{{ site.time | date: '%s' }}">
<head>
{% include head.html %}
<link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}?v={{ site.time | date: '%s' }}">
<link rel="stylesheet" href="{{ '/assets/css/home.css' | relative_url }}?v={{ site.time | date: '%s' }}">
<link rel="modulepreload" href="{{ '/assets/js/site.js' | relative_url }}">
<script type="module" src="{{ '/assets/js/site.js' | relative_url }}"></script>
<script type="module" src="{{ '/assets/js/home.js' | relative_url }}"></script>
</head>
<body class="page-home">
<a class="skip-link" href="#content">跳到正文</a>
{% include site-header.html section="home" variant="home" %}
<main id="content" tabindex="-1">
{{ content }}
</main>
{% include site-footer.html %}
{% include search.html %}
</body>
</html>
