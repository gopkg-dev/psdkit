{%- comment -%}
  首页示意图层：本项目自有的 SVG 图形（MIT），用于图层装置和滚动叙事。
  参数 p：渐变 ID 前缀，避免同一页面多次渲染时冲突。
  图层自下而上：透明画布、背景渐变、主体智能对象（含蒙版）、光晕（滤色）、远山形状、文字。
{%- endcomment -%}
{%- assign p = include.p | default: "a" -%}
<div class="art-layer art-layer--canvas checker" data-layer="canvas" style="--i:0"></div>
<div class="art-layer" data-layer="bg" style="--i:1">
  <svg viewBox="0 0 640 480" preserveAspectRatio="xMidYMid slice" aria-hidden="true" focusable="false">
    <defs>
      <linearGradient id="{{ p }}-bg" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#070b26" /><stop offset=".6" stop-color="#17134d" /><stop offset="1" stop-color="#2b1a62" />
      </linearGradient>
      <radialGradient id="{{ p }}-bg-glow" cx=".7" cy=".36" r=".6">
        <stop offset="0" stop-color="#4f7bff" stop-opacity=".42" /><stop offset="1" stop-color="#4f7bff" stop-opacity="0" />
      </radialGradient>
    </defs>
    <rect width="640" height="480" fill="url(#{{ p }}-bg)" />
    <rect width="640" height="480" fill="url(#{{ p }}-bg-glow)" />
    <g fill="#d6ecff">
      <circle cx="52" cy="160" r="1.4" opacity=".7" /><circle cx="118" cy="196" r="1" opacity=".5" /><circle cx="210" cy="148" r="1.6" opacity=".8" />
      <circle cx="268" cy="64" r="1" opacity=".5" /><circle cx="300" cy="190" r="1.2" opacity=".6" /><circle cx="604" cy="54" r="1.5" opacity=".7" />
      <circle cx="586" cy="168" r="1" opacity=".5" /><circle cx="168" cy="250" r="1.1" opacity=".4" /><circle cx="360" cy="30" r="1.3" opacity=".6" />
      <circle cx="18" cy="40" r="1" opacity=".4" /><circle cx="612" cy="250" r="1.2" opacity=".5" /><circle cx="232" cy="222" r=".9" opacity=".5" />
    </g>
  </svg>
</div>
<div class="art-layer art-layer--subject" data-layer="subject" style="--i:2">
  <svg viewBox="0 0 640 480" preserveAspectRatio="xMidYMid slice" aria-hidden="true" focusable="false">
    <defs>
      <linearGradient id="{{ p }}-sun" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#7cf3ff" /><stop offset=".34" stop-color="#22c8ff" /><stop offset=".62" stop-color="#5b6bff" /><stop offset=".86" stop-color="#a06bff" /><stop offset="1" stop-color="#ff5bd6" />
      </linearGradient>
      <radialGradient id="{{ p }}-mask-fill" cx=".5" cy=".5" r=".5">
        <stop offset=".93" stop-color="#fff" /><stop offset="1" stop-color="#000" />
      </radialGradient>
      <mask id="{{ p }}-mask" maskUnits="userSpaceOnUse" x="0" y="0" width="640" height="480">
        <rect width="640" height="480" fill="#000" />
        <circle cx="452" cy="176" r="124" fill="url(#{{ p }}-mask-fill)" />
      </mask>
      <g id="{{ p }}-content">
        <rect x="320" y="44" width="264" height="264" fill="url(#{{ p }}-sun)" />
        <g fill="#130f3f">
          <rect x="320" y="198" width="264" height="5" /><rect x="320" y="216" width="264" height="7" /><rect x="320" y="236" width="264" height="9" />
          <rect x="320" y="258" width="264" height="11" /><rect x="320" y="282" width="264" height="13" />
        </g>
        <path d="M320 44h264v264H320z" fill="none" stroke="#ffffff" stroke-opacity=".18" />
      </g>
    </defs>
    <g class="subject-full"><use href="#{{ p }}-content" /></g>
    <g class="subject-masked" mask="url(#{{ p }}-mask)"><use href="#{{ p }}-content" /></g>
    <circle class="mask-ants" cx="452" cy="176" r="124" fill="none" stroke="#e9fdff" stroke-width="1.6" stroke-dasharray="6 5" />
  </svg>
</div>
<div class="art-layer art-layer--glow" data-layer="glow" style="--i:3">
  <svg viewBox="0 0 640 480" preserveAspectRatio="xMidYMid slice" aria-hidden="true" focusable="false">
    <defs>
      <radialGradient id="{{ p }}-glow" cx="452" cy="176" r="250" gradientUnits="userSpaceOnUse">
        <stop offset="0" stop-color="#5ff0ff" stop-opacity=".62" /><stop offset=".45" stop-color="#4f7bff" stop-opacity=".22" /><stop offset="1" stop-color="#8b7bff" stop-opacity="0" />
      </radialGradient>
    </defs>
    <rect width="640" height="480" fill="url(#{{ p }}-glow)" />
    <g stroke="#bff8ff" stroke-linecap="round" opacity=".7"><path d="M452 20v40M452 292v24" stroke-width="1.2" /><path d="M296 176h36M572 176h44" stroke-width="1.2" /></g>
  </svg>
</div>
<div class="art-layer" data-layer="ridge" style="--i:4">
  <svg viewBox="0 0 640 480" preserveAspectRatio="xMidYMid slice" aria-hidden="true" focusable="false">
    <defs>
      <linearGradient id="{{ p }}-ridge-back" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3a3f9a" /><stop offset="1" stop-color="#151848" /></linearGradient>
      <linearGradient id="{{ p }}-ridge-front" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#121640" /><stop offset="1" stop-color="#05061a" /></linearGradient>
    </defs>
    <path d="M0 352 76 300l70 30 92-84 88 74 86-52 104 64 124-54v202H0Z" fill="url(#{{ p }}-ridge-back)" opacity=".92" />
    <path d="M0 408 104 346l92 46 100-66 94 66 82-38 90 52 78-30v104H0Z" fill="url(#{{ p }}-ridge-front)" />
    <path d="M0 408 104 346l92 46 100-66 94 66 82-38 90 52 78-30" fill="none" stroke="#5ff0ff" stroke-opacity=".55" stroke-width="1.4" />
  </svg>
</div>
<div class="art-layer" data-layer="title" style="--i:5">
  <svg viewBox="0 0 640 480" preserveAspectRatio="xMidYMid slice" aria-hidden="true" focusable="false">
    <text x="40" y="92" fill="#ffffff" font-size="46" font-weight="800" letter-spacing="-1.5" style="font-family: var(--font-sans)">逐层可编程</text>
    <text x="42" y="124" fill="#a9b8ff" font-size="14" letter-spacing="2" style="font-family: var(--font-mono)">LAYER · BY · CODE</text>
    <rect x="42" y="140" width="56" height="3" rx="1.5" fill="#22e4ff" />
  </svg>
</div>
