<div class="search-dialog" data-search-dialog hidden>
  <div class="search-dialog__backdrop" data-search-close></div>
  <div class="search-dialog__panel" role="dialog" aria-modal="true" aria-labelledby="search-title">
    <h2 id="search-title" class="visually-hidden">搜索文档</h2>
    <div class="search-dialog__field">
      {% include icon.html name="search" px=18 %}
      <input type="search" data-search-input placeholder="搜索 API、能力或指南，例如 SetOpacity、Warp、预算" aria-label="搜索关键词" autocomplete="off" spellcheck="false" aria-controls="search-results" aria-activedescendant="">
      <button class="search-dialog__esc" type="button" data-search-close aria-label="关闭搜索"><kbd>Esc</kbd></button>
    </div>
    <ul class="search-dialog__results" id="search-results" role="listbox" data-search-results aria-label="搜索结果"></ul>
    <p class="search-dialog__hint"><span><kbd>↑</kbd><kbd>↓</kbd> 选择</span><span><kbd>Enter</kbd> 打开</span><span>索引在本机构建，不发送查询</span></p>
  </div>
</div>
<script type="application/json" id="search-pages">[{% for section in site.data.nav %}{% for item in section.items %}{% unless item.url contains "#" %}{"title":{{ item.title | jsonify }},"section":{{ section.title | jsonify }},"url":{{ item.url | relative_url | jsonify }}},{% endunless %}{% endfor %}{% endfor %}null]</script>
